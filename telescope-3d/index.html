<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>굴절 망원경 만들기 3D 가이드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;800&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#1b1b1b;--paper:#f6f3ea;--orange:#ff6a1f;--navy:#1f2a68;--line:2px solid #1b1b1b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#e8e2d4;color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;overflow:hidden}
#app{height:100vh;display:grid;grid-template-rows:1fr auto}
#stage{position:relative;overflow:hidden;min-height:0}
#c{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none}
.box{background:rgba(250,248,242,.96);border:var(--line);border-radius:8px}
.mono{font-family:'JetBrains Mono','Noto Sans KR',monospace}
.fig{position:absolute;left:14px;top:14px;padding:10px 16px;max-width:62%}
.fig-t{font:900 17px 'Noto Sans KR',sans-serif;letter-spacing:.02em}
.fig-s{font:700 19px 'Noto Sans KR';margin-top:4px}
.side{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.mode{padding:8px 16px;text-align:right;min-width:170px}
.k{font:800 12px 'JetBrains Mono',monospace;letter-spacing:.12em;color:#6b6b6b}
.mode-v{font:900 40px/1.05 'Noto Sans KR';margin-top:2px}
.mode-s{font:800 16px 'JetBrains Mono',monospace;margin-top:2px}
.tools{padding:8px 12px;min-width:170px;max-width:260px}
#toolList{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.tool{display:flex;align-items:center;gap:8px;font:700 19px 'Noto Sans KR'}
.tool i{width:14px;height:14px;border-radius:3px;border:1.5px solid #1b1b1b;flex:none}
.tool.none{color:#888;font-weight:500;font-size:16px}
.hint{position:absolute;left:14px;bottom:10px;max-width:calc(100% - 540px);font:600 14px 'Noto Sans KR';color:#3a3a3a;background:rgba(246,243,234,.78);padding:4px 10px;border-radius:6px}
.vbtns{position:absolute;right:14px;bottom:12px;display:flex;gap:8px}
.pill{font:800 18px 'Noto Sans KR';background:#fff;border:var(--line);border-radius:999px;padding:6px 16px;cursor:pointer}
.pill.on{background:var(--ink);color:#fff}
.pill svg{width:1em;height:1em;vertical-align:-.13em;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#app.fold #panel{grid-template-columns:1fr}
#app.fold #panel .card:first-child,#app.fold .ht-body,#app.fold .ht-warn.show{display:none}
#app.fold .ht-title{font-size:26px}
#app.fold .prog{margin-top:6px}
.ctrl button#fold{background:var(--paper)}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;background:#fff;border:2px solid #1b1b1b;border-radius:999px;padding:3px 12px;font:800 19px 'JetBrains Mono','Noto Sans KR',monospace;will-change:transform}
.lbl::after{content:'';position:absolute;left:50%;top:100%;width:2px;height:16px;background:#1b1b1b;transform:translateX(-1px)}
.lbl.warn{border-color:var(--orange);color:#c2410c;background:#fff4ea}
.lbl.warn::after{background:var(--orange)}
.lbl.bad{border-color:#d62828;color:#d62828;background:#fff0f0}
.lbl.bad::after{background:#d62828}
.lbl.good{border-color:#2f8f3a;color:#22742c;background:#effaf0}
.lbl.good::after{background:#2f8f3a}
.lbl.big{font-size:24px;padding:5px 16px}
#panel{display:grid;grid-template-columns:1.08fr 1fr;gap:10px;padding:10px;background:#1b1b1b}
.card{background:var(--paper);border-radius:10px;padding:12px 16px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;font:800 14px 'JetBrains Mono','Noto Sans KR',monospace;letter-spacing:.08em;margin-bottom:8px}
.cnt{border:1.5px solid #1b1b1b;border-radius:999px;padding:1px 10px;font-size:14px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.tab{font:800 19px 'Noto Sans KR';padding:8px 6px;border:2px solid #1b1b1b;border-radius:8px;background:#fff;cursor:pointer}
.tab.on{background:#1b1b1b;color:#fff}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:6px}
.chip{border:1.5px solid #b9b4a6;border-radius:8px;background:#fff;cursor:pointer;padding:6px 4px;text-align:center}
.chip b{display:block;font:800 22px 'JetBrains Mono',monospace}
.chip span{display:block;font:700 15px 'Noto Sans KR';margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.on{background:#1b1b1b;border-color:#1b1b1b;color:#fff}
.chip.done{background:#ebe7dc}
.ctrl{display:flex;gap:6px}
.ctrl button{font:800 17px 'Noto Sans KR';border:2px solid #1b1b1b;background:#fff;border-radius:8px;padding:4px 12px;cursor:pointer;letter-spacing:0}
.ctrl button#next{background:#1b1b1b;color:#fff}
.ht-title{font:900 32px/1.2 'Noto Sans KR'}
.ht-title em{font-style:normal;display:inline-block;background:var(--navy);color:#fff;border-radius:6px;padding:0 10px;margin-right:10px;font-family:'JetBrains Mono',monospace}
.ht-body{font:500 24px/1.45 'Noto Sans KR';margin-top:6px}
.ht-body b{font-weight:900;color:#1f3fae}
.ht-warn{display:none;margin-top:8px;border:2px solid var(--orange);background:#fff1e6;border-radius:8px;padding:6px 12px;font:700 20px/1.4 'Noto Sans KR';color:#9a3412}
.ht-warn.show{display:block}
.prog{height:6px;background:#ddd6c6;border-radius:3px;margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--orange)}
.done-badge{display:inline-block;margin-left:10px;background:#2f8f3a;color:#fff;border-radius:6px;padding:0 10px;font-size:22px;vertical-align:middle}
@media (max-width:900px){#panel{grid-template-columns:1fr}.ht-body{font-size:19px}.ht-title{font-size:24px}.mode-v{font-size:28px}.fig-s{font-size:15px}}
.touch-only{display:none}
/* 휴대폰 세로 */
@media (max-width:700px){
  #app{height:100dvh;grid-template-rows:minmax(0,1fr) auto}
  #panel{gap:6px;padding:6px;max-height:47dvh;overflow-y:auto;-webkit-overflow-scrolling:touch}
  #panel .card:last-child{order:-1}
  .card{padding:8px 10px}
  .card-h{font-size:11px;margin-bottom:6px;letter-spacing:.04em}
  .card-h>span:first-child{white-space:nowrap}
  .ctrl button{font-size:15px;padding:6px 10px;white-space:nowrap;flex:1}
  #panel .card:last-child .card-h>span:first-child{display:none}
  #panel .card:last-child .ctrl{flex:1}
  .ht-title{font-size:19px}.ht-title em{padding:0 7px;margin-right:6px}
  .ht-body{font-size:16px;line-height:1.5}
  .ht-warn{font-size:14px;padding:5px 9px}
  .done-badge{font-size:15px}
  .tabs{gap:4px;margin-bottom:6px}
  .tab{font-size:13px;padding:6px 2px;line-height:1.25;word-break:keep-all}
  .chips{display:flex;overflow-x:auto;gap:5px;padding-bottom:2px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 78px;padding:4px 3px}
  .chip b{font-size:17px}.chip span{font-size:12px}
  .fig{left:6px;top:6px;padding:5px 8px;max-width:calc(100% - 128px)}
  .fig-t{font-size:12px}.fig-s{font-size:13px;line-height:1.35;margin-top:2px}
  .side{right:6px;top:6px;gap:5px}
  .mode,.tools{min-width:0;padding:4px 8px}
  .mode{width:112px}.tools{width:112px}
  .k{font-size:9px;letter-spacing:.06em}
  .mode-v{font-size:19px}.mode-s{font-size:11px}
  #toolList{gap:2px;margin-top:3px}
  .tool{font-size:12px;gap:5px}.tool i{width:10px;height:10px}
  .tool.none{font-size:11px}
  .hint{left:6px;bottom:44px;font-size:10px;padding:2px 6px;max-width:calc(100% - 12px)}
  #app.fold .ht-title{font-size:17px}
  .vbtns{right:6px;bottom:6px;gap:5px}
  .pill .pt{display:none}
  .pill{font-size:14px;padding:4px 11px}
  .lbl{font-size:12px;padding:2px 8px;border-width:1.5px}
  .lbl::after{height:10px}
  .lbl.big{font-size:14px;padding:3px 10px}
}
/* 휴대폰 가로 */
@media (max-height:520px) and (orientation:landscape){
  #app{height:100dvh;grid-template-rows:1fr;grid-template-columns:minmax(0,1fr) min(44vw,400px)}
  #panel{grid-template-columns:1fr;gap:6px;padding:6px;overflow-y:auto;align-content:start}
  #panel .card:last-child{order:-1}
  .card{padding:8px 10px}
  .card-h{font-size:11px;margin-bottom:6px}
  .ctrl button{font-size:14px;padding:4px 9px;white-space:nowrap;flex:1}
  #panel .card:last-child .card-h>span:first-child{display:none}
  #panel .card:last-child .ctrl{flex:1}
  .ht-title{font-size:18px}.ht-body{font-size:15px}.ht-warn{font-size:13px}
  #app.fold .ht-title{font-size:16px}
  #app.fold{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  #app.fold #panel .card-h{margin-bottom:2px}
  .tab{font-size:12px;padding:5px 2px}
  .chip b{font-size:16px}.chip span{font-size:11px}
  .chips{grid-template-columns:repeat(auto-fill,minmax(70px,1fr))}
  .fig{left:6px;top:6px;padding:5px 8px;max-width:calc(100% - 128px)}
  .fig-t{font-size:12px}.fig-s{font-size:13px}
  .side{right:6px;top:6px;gap:5px}
  .mode,.tools{min-width:0;width:112px;padding:4px 8px}
  .k{font-size:9px}.mode-v{font-size:19px}.mode-s{font-size:11px}
  .tool{font-size:12px}.tool i{width:10px;height:10px}
  .hint{display:none}
  .vbtns{right:6px;bottom:6px}.pill{font-size:13px;padding:4px 10px}
  .lbl{font-size:12px;padding:2px 8px}.lbl.big{font-size:14px}
}
@media (hover:none) and (pointer:coarse){.key-only{display:none}.touch-only{display:inline}}
</style>

</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="labels"></div>
    <div class="fig box"><div class="fig-t" id="figT">굴절 망원경 만들기 3D 가이드</div><div class="fig-s" id="figS"></div></div>
    <div class="side">
      <div class="mode box"><div class="k">PART</div><div class="mode-v" id="modeV">도안</div><div class="mode-s" id="modeS">STEP 01 / 22</div></div>
      <div class="tools box"><div class="k">TOOLS · 도구</div><div id="toolList"></div></div>
    </div>
    <div class="hint"><span class="key-only">드래그: 회전 · 휠: 확대 · ←/→: 단계 이동 · Space: 다시 보기 · S: 소리 · F: 전체화면 · H: 설명 접기 &nbsp;|&nbsp; </span><span class="touch-only">한 손가락: 돌리기 · 두 손가락: 확대 <br></span>제작: 과학교사 구인회, 노정현 · v1.5 (2026.11.27)</div>
    <div class="vbtns"><button id="sndBtn" class="pill on" title="소리 켜기/끄기 (S)">🔊<span class="pt"> 소리</span></button><button id="xrayBtn" class="pill">속 보기</button><button id="lblBtn" class="pill on">라벨</button><button id="fsBtn" class="pill" title="전체화면 (F)"></button></div>
  </div>
  <div id="panel">
    <div class="card">
      <div class="card-h"><span>STEP · 만드는 순서</span><span class="cnt" id="cnt">1/22</span></div>
      <div class="tabs" id="tabs"></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="card">
      <div class="card-h"><span>HOW TO · 이렇게 해요</span><span class="ctrl"><button id="prev">◀ 이전</button><button id="replay">↻ 다시</button><button id="next">다음 ▶</button><button id="fold" title="설명 접기/펴기 (H)">▼ 접기</button></span></div>
      <div class="ht-title" id="htT"></div>
      <div class="ht-body" id="htB"></div>
      <div class="ht-warn" id="htW"></div>
      <div class="prog"><i id="progBar"></i></div>
    </div>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const PI=Math.PI, TH=0.15;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const lerp=(a,b,t)=>a+(b-a)*t;
const V=(x,y,z)=>new THREE.Vector3(x,y,z);

/* ---------- renderer / scene ---------- */
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xe4ddcd);
const camera=new THREE.PerspectiveCamera(36,1,0.5,800);
camera.position.set(0,62,52);
const controls=new OrbitControls(camera,canvas);
controls.enableDamping=true; controls.dampingFactor=.08; controls.maxPolarAngle=PI*0.47; controls.minDistance=6; controls.maxDistance=180;
const ANISO=renderer.capabilities.getMaxAnisotropy();

scene.add(new THREE.HemisphereLight(0xffffff,0x8d8170,1.05));
const sun=new THREE.DirectionalLight(0xffffff,2.1); sun.position.set(28,70,34);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-70,right:70,top:70,bottom:-70,near:5,far:220});
sun.shadow.bias=-0.0004; sun.shadow.normalBias=0.03; scene.add(sun);
const fill=new THREE.DirectionalLight(0xdfe8ff,.55); fill.position.set(-40,30,-20); scene.add(fill);

function ctex(cv,rep){const t=new THREE.CanvasTexture(cv);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=ANISO;if(rep){t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rep,rep)}return t}
function std(c,r=.7,m=0,extra={}){return new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:r,metalness:m},extra))}

/* table */
{const cv=document.createElement('canvas');cv.width=cv.height=1024;const x=cv.getContext('2d');
 x.fillStyle='#ead9b8';x.fillRect(0,0,1024,1024);
 for(let i=0;i<260;i++){const y=Math.random()*1024;x.strokeStyle=`rgba(${150+Math.random()*40|0},${110+Math.random()*30|0},70,${.05+Math.random()*.12})`;x.lineWidth=1+Math.random()*3;x.beginPath();x.moveTo(0,y);for(let k=0;k<=8;k++)x.lineTo(k*128,y+Math.sin(k*1.3+i)*6);x.stroke()}
 const m=new THREE.Mesh(new THREE.PlaneGeometry(600,600),std(0xffffff,.85,0,{map:ctex(cv,6)}));m.rotation.x=-PI/2;m.position.y=-0.08;m.receiveShadow=true;scene.add(m)}
/* cutting mat 80 x 62 */
{const W=80,Hh=62,pp=24,cv=document.createElement('canvas');cv.width=W*pp;cv.height=Hh*pp;const x=cv.getContext('2d');
 x.fillStyle='#1f2a68';x.fillRect(0,0,cv.width,cv.height);
 for(let i=0;i<=W;i++){x.strokeStyle=i%5?'rgba(255,255,255,.16)':'rgba(255,255,255,.36)';x.lineWidth=i%5?1:2;x.beginPath();x.moveTo(i*pp,0);x.lineTo(i*pp,cv.height);x.stroke()}
 for(let j=0;j<=Hh;j++){x.strokeStyle=j%5?'rgba(255,255,255,.16)':'rgba(255,255,255,.36)';x.lineWidth=j%5?1:2;x.beginPath();x.moveTo(0,j*pp);x.lineTo(cv.width,j*pp);x.stroke()}
 x.strokeStyle='rgba(255,255,255,.2)';x.lineWidth=1.5;for(let k=-Hh;k<W;k+=15){x.beginPath();x.moveTo(k*pp,0);x.lineTo((k+Hh)*pp,cv.height);x.stroke();x.beginPath();x.moveTo((k+Hh)*pp,0);x.lineTo(k*pp,cv.height);x.stroke()}
 x.fillStyle='rgba(255,255,255,.75)';x.font='bold 26px JetBrains Mono, monospace';
 for(let i=5;i<W;i+=5)x.fillText(i,i*pp-12,30);for(let j=5;j<Hh;j+=5)x.fillText(j,8,j*pp+9);
 x.font='bold 30px JetBrains Mono, monospace';x.fillText('SELF-HEALING CUTTING MAT · A1',cv.width-640,cv.height-24);
 const m=new THREE.Mesh(new THREE.BoxGeometry(W,0.12,Hh),[std(0x1a2358),std(0x1a2358),std(0xffffff,.75,0,{map:ctex(cv)}),std(0x1a2358),std(0x1a2358),std(0x1a2358)]);
 m.position.y=-0.06;m.receiveShadow=true;scene.add(m)}

const root=new THREE.Group(); scene.add(root);

/* ---------- materials ---------- */
const sheetMats=[];
function regMat(m){sheetMats.push(m);return m}
const blackSide=regMat(std(0x141417,.9));

/* ---------- RollSheet: cardboard piece that can be rolled into a spiral tube ---------- */
class RollSheet{
  constructor(L,H,r0,opt={}){
    this.L=L;this.H=H;this.r0=r0;this.th=opt.th||TH;this.name=opt.name||'';
    this.nu=Math.max(30,Math.ceil(L/0.22));const nu=this.nu,nv=2;
    const pos=new Float32Array((nu+1)*(nv+1)*3),uv=new Float32Array((nu+1)*(nv+1)*2),idx=[];
    for(let i=0;i<=nu;i++)for(let j=0;j<=nv;j++){const k=i*(nv+1)+j;uv[k*2]=i/nu;uv[k*2+1]=1-j/nv}
    for(let i=0;i<nu;i++)for(let j=0;j<nv;j++){const a=i*(nv+1)+j,b=(i+1)*(nv+1)+j,c=a+1,d=b+1;idx.push(a,c,b,b,c,d)}
    const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('uv',new THREE.BufferAttribute(uv,2));g.setIndex(idx);
    this.geo=g;
    const ppc=Math.min(26,4000/L);this.ppc=ppc;
    this.cv=document.createElement('canvas');this.cv.width=Math.ceil(L*ppc);this.cv.height=Math.max(16,Math.ceil(H*ppc));
    this.tex=ctex(this.cv);
    const bc=document.createElement('canvas');bc.width=Math.ceil(L*Math.min(14,4000/L));bc.height=8;const bx=bc.getContext('2d');
    bx.fillStyle='#19191c';bx.fillRect(0,0,bc.width,8);bx.fillStyle='#27272c';const bp=bc.width/L;for(let s=.2;s<L;s+=.45)bx.fillRect(s*bp,0,Math.max(1,.12*bp),8);
    this.front=new THREE.Mesh(g,regMat(std(0xffffff,.82,0,{map:this.tex,side:THREE.FrontSide})));
    this.back=new THREE.Mesh(g,regMat(std(0xffffff,.88,0,{map:ctex(bc),side:THREE.BackSide})));
    for(const m of [this.front,this.back]){m.castShadow=true;m.receiveShadow=true}
    this.group=new THREE.Group();this.group.add(this.front,this.back);root.add(this.group);
    this.decorKey=null;this.p=-1;this.setDecor({});this.update(0);
  }
  R(s){return Math.sqrt(this.r0*this.r0+this.th*s/PI)}
  phi(s){return 2*PI*(this.R(s)-this.r0)/this.th}
  get outer(){return this.R(this.L)}
  center(p){const l=p*this.L;return {x:l,y:this.R(l)}}
  update(p){
    if(Math.abs(p-this.p)<1e-6)return;this.p=p;
    const L=this.L,H=this.H,nu=this.nu,l=p*L,Rl=this.R(l),pl=this.phi(l),a=this.geo.attributes.position.array;
    for(let i=0;i<=nu;i++){const s=i/nu*L;let x,y;
      if(s<l){const Rs=this.R(s),d=pl-this.phi(s);x=l-Rs*Math.sin(d);y=Rl-Rs*Math.cos(d)}else{x=s;y=0}
      for(let j=0;j<=2;j++){const k=(i*3+j)*3;a[k]=x;a[k+1]=y;a[k+2]=-H/2+j/2*H}}
    this.geo.attributes.position.needsUpdate=true;this.geo.computeVertexNormals();this.geo.computeBoundingSphere();
  }
  setDecor(d){
    const key=JSON.stringify(d);if(key===this.decorKey)return;this.decorKey=key;
    const x=this.cv.getContext('2d'),pp=this.ppc,L=this.L,H=this.H;

  cams:[{p:[-40,26,3],t:[-2,2.5,2]},{p:[-20,15,-30],t:[0,3.5,-8]},{p:[-12,10,-24],t:[0,4,-9]},{p:[-22,16,-14],t:[0,4,5]},{p:[-40,26,3],t:[-2,2.5,2]},{p:[-34,18,6],t:[0,3,5]}],
  apply(t,time){const T0=-9,k=ease(seg(t,0,.08)),fa=seg(t,.79,1);const f=fa*2.7*(1-Math.cos(time*1.4));
    const ph=t<.09?0:t<.375?5:t<.51?1:t<.64?2:t<.78?3:4;if(this._ph!==ph){this._ph=ph;camTo(this.cams[ph])}
    const Y=SCY;placeScope(0,Y,T0,f,false);const cz=T0+19.5+(1-k)*16;tube(P7,1,0,Y,cz);lensO.visible=true;lensO.position.set(0,Y,cz);
    /* 절연테이프 4곳을 차례로 한 바퀴씩 */
    TAPE_BANDS.forEach((B,i)=>{const s0=.1+i*.065,w=ease(seg(t,s0,s0+.06));if(w<=0)return;const th=w*2*PI;setBand(B,th,Y);
      if(w<1){const a=PI+th,R=B.R+2.2;rollAxis(eTapeB,'z',true);show(eTapeB,Math.sin(a)*R,Y+Math.cos(a)*R,(B.z0+B.z1)/2);
        L('절연테이프 한 바퀴: '+B.name,0,Y+B.R+3,(B.z0+B.z1)/2,'warn big')}});
    /* 옆면 3곳에 차례로: 목공풀을 한 바퀴 짜고 → 펴 바르기 */
    const N=glueDots.length;
    GLUE_FACES.forEach((F,i)=>{const s0=.38+i*.13,g=seg(t,s0,s0+.08),sp=ease(seg(t,s0+.08,s0+.12)),R=(F.r0+F.r1)/2,out=-1,z=F.z-(F.move?f:0);
      if(g<=0)return;
      if(sp<1)for(let j=0;j<N;j++){if(j/N<g){const a=(j/N)*PI*2;glueDots[j].visible=true;glueDots[j].scale.set(1,.6*(1-sp*.7),1);glueDots[j].position.set(-Math.sin(a)*R,Y+Math.cos(a)*R,z+out*.12)}}
      if(g<1){const a=g*PI*2;glue.visible=true;glue.position.set(-Math.sin(a)*(R+.5),Y+Math.cos(a)*(R+.5),z+out*.7);glue.rotation.set(0,0,-a)}
      if(sp>0){F.mesh.visible=true;F.mesh.material.opacity=.6*sp;F.mesh.position.set(0,Y,z)}
      if(t>s0&&t<s0+.13)L(F.name+'에 목공풀',0,Y+F.r1+1.4+(F.move?1.6:0),z,'warn big')});
    const ez=T0+5.5-f;
    L('대물렌즈 7.5cm',0,Y+P7.outer+.2,T0+22);L('경통 ⑥',0,Y+P6.outer+.2,T0+9);
    L('고리 ④⑤ (경통 속)',-6,.2,T0+2);L('접안렌즈 3cm × 2',-5,.2,ez-5.4);L('눈',0,Y+1,ez-8.4,'big');
    if(t>.38&&t<.64)L('렌즈 통·고리 안쪽 틈은 풀 X',0,Y-P2l.outer-.6,T0-3,'bad');
    if(t>=.78){L('감은 옆면: 목공풀 O',0,Y+P7.outer+2.6,T0+15,'good');L('움직이는 곳: 풀 X',0,Y+P2l.outer+.3,ez-6.2,'bad')}
    if(t>.79)L('↔ 밀고 당겨 초점 맞추기',-9,.2,ez-8,'warn big')}}
];

/* ---------- 효과음 (소리 파일 없이 페이지 안에서 만듦) ---------- */
const SND=(()=>{
  let ctx=null,master=null,noise=null,on=localStorage.getItem('telescope3d.sound')!=='off';const live=new Set();
  function init(){if(ctx){if(ctx.state==='suspended')ctx.resume();return}
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;ctx=new AC();master=ctx.createGain();master.gain.value=.85;master.connect(ctx.destination);
    const len=ctx.sampleRate*2;noise=ctx.createBuffer(1,len,ctx.sampleRate);const d=noise.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1}
  addEventListener('pointerdown',init);addEventListener('keydown',init);
  const now=()=>ctx.currentTime;
  function env(g,t0,a,hold,r,peak){g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(peak,t0+a);g.gain.setValueAtTime(peak,t0+a+hold);g.gain.linearRampToValueAtTime(0,t0+a+hold+r)}
  function track(n,end){live.add(n);n.onended=()=>live.delete(n);n.stop(end+.05)}
  /* 잡음 소리: 필터 + 떨림(AM) */
  function nz({len=.2,type='bandpass',f=1000,f2=null,q=1,peak=.3,a=.01,r=.08,am=0,amDepth=.8,t0=0}){
    const t=now()+t0,src=ctx.createBufferSource();src.buffer=noise;src.loop=true;src.loopStart=Math.random();
    const fl=ctx.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+len);fl.Q.value=q;
    const g=ctx.createGain();env(g,t,a,Math.max(0,len-a-r),r,peak);src.connect(fl);fl.connect(g);
    let out=g;if(am){const m=ctx.createGain();m.gain.value=1-amDepth;const o=ctx.createOscillator();o.type='square';o.frequency.value=am;const od=ctx.createGain();od.gain.value=amDepth;o.connect(od);od.connect(m.gain);g.connect(m);out=m;o.start(t);track(o,t+len)}
    out.connect(master);src.start(t,Math.random());track(src,t+len)}
  function tone({f=440,f2=null,len=.3,type='sine',peak=.2,a=.005,t0=0}){
    const t=now()+t0,o=ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+len);
    const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0008,t+len);o.connect(g);g.connect(master);o.start(t);track(o,t+len)}
  const S={
    tap:()=>{nz({len:.045,type:'highpass',f:2600,peak:.35,a:.002,r:.035});tone({f:1800,f2:900,len:.04,peak:.05})},             // 연필 점 톡
    scratch:l=>nz({len:l,f:3200,q:1.4,peak:.11,a:.04,r:.08,am:17,amDepth:.6}),                                              // 연필 사각사각
    cut:l=>{const n=Math.max(1,Math.round(l/.55));for(let i=0;i<n;i++)nz({len:Math.min(.5,l/n),f:2600,f2:1300,q:1.2,peak:.26,a:.03,r:.15,t0:i*l/n})}, // 칼 슥-슥
    tape:l=>nz({len:Math.min(l,1.6),f:1500,f2:1000,q:.9,peak:.16,a:.05,r:.15,am:31,amDepth:.35}),                             // 양면테이프 쓱
    peel:l=>{const L=Math.min(Math.max(l,.35),.9);nz({len:L,type:'bandpass',f:900,f2:4200,q:1.1,peak:.34,a:.02,r:.12,am:55,amDepth:.7})}, // 비닐 찌익
    roll:l=>nz({len:l,type:'lowpass',f:900,q:.7,peak:.15,a:.12,r:.2,am:21,amDepth:.75}),                                    // 골판지 드르륵
    etape:l=>{nz({len:l,f:2300,f2:2900,q:4,peak:.15,a:.05,r:.12,am:42,amDepth:.5});tone({f:520,f2:700,len:l,type:'triangle',peak:.025,a:.05})}, // 절연테이프 쭈욱
    glue:()=>{nz({len:.42,type:'lowpass',f:500,f2:250,q:2,peak:.3,a:.02,r:.2});[0,.11,.22].forEach(d=>tone({f:220-d*200,f2:110,len:.09,peak:.12,t0:d}))}, // 목공풀 뿌직
    tink:()=>{tone({f:2637,len:.7,peak:.12});tone({f:3951,len:.45,peak:.06});tone({f:5274,len:.25,peak:.03})},               // 렌즈 팅
    thud:()=>{tone({f:110,f2:48,len:.18,peak:.45});nz({len:.08,type:'lowpass',f:700,peak:.22,a:.002,r:.06})},                 // 툭
    slide:l=>nz({len:l,f:700,q:.8,peak:.08,a:.25,r:.3}),                                                                  // 스르륵
    chime:()=>[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone({f,len:.55,type:'triangle',peak:.16,t0:i*.12})),             // 딩동댕
    click:()=>tone({f:1400,f2:900,len:.035,type:'square',peak:.035})                                                       // 딸깍
  };
  return {
    get on(){return on},
    set(v){on=v;localStorage.setItem('telescope3d.sound',v?'on':'off');if(!v)this.stop()},
    play(name,len=.3){if(!on||!ctx||ctx.state!=='running')return;try{S[name](len)}catch(e){}},
    stop(){live.forEach(n=>{try{n.stop()}catch(e){}});live.clear()},
    names:Object.keys(S),test(name,len=.5){init();S[name](len);return live.size},get state(){return ctx?ctx.state:'none'},
    init
  };
})();

/* 단계마다 소리 나는 때: [시작, 소리, 끝] (0~1 = 단계 진행) */
const SFX=(()=>{const X={},c=(a,s,b)=>({a,s,b});
  X[0]=[c(.7,'thud')];
  X[1]=DSEG[2].dots.map((_,i)=>c((i+.6)/9,'tap'));
  [2,3,4,5].forEach(k=>{const n=DSEG[k+1].lines.length;X[k]=DSEG[k+1].lines.map((_,i)=>c((i+.15)/n,'scratch',(i+1)/n-.01))});
  X[6]=CELLS.map((_,i)=>c((i+.5)/CELLS.length,'scratch',(i+.5)/CELLS.length+.035));
  {let acc=0;X[7]=CUTS.map((_,i)=>{const a=acc/CUTTOT*.74;acc+=CUTLEN[i];return c(a,'cut',acc/CUTTOT*.74-.004)});X[7].push(c(.76,'thud'))}
  X[8]=[c(.05,'scratch',.24),c(.27,'scratch',.46),c(.52,'tape',.74),c(.77,'tape',.98)];
  X[9]=[c(.04,'peel',.27),c(.3,'peel',.53),c(.8,'tink'),c(.95,'tink')];
  X[10]=[c(.08,'roll',.95)];
  X[11]=[c(.12,'etape',.9)];
  X[12]=[c(.2,'thud'),c(.36,'thud'),c(.38,'tape',.5),c(.52,'peel',.64),c(.66,'roll',.98)];
  X[13]=[c(0,'tape',.1),c(.11,'tape',.21),c(.22,'peel',.31),c(.42,'thud'),c(.44,'roll',.79),c(.8,'peel',.88),c(.89,'roll',.98),c(.95,'chime')];
  X[14]=[c(0,'slide',.35),c(.35,'thud'),c(.58,'tape',.62)];
  X[15]=[c(.04,'roll',.72),c(.74,'tape',.82),c(.83,'peel',.92),c(.93,'roll',.995),c(.999,'slide',1.25)];
  X[16]=[c(.04,'roll',.72),c(.74,'tape',.82),c(.83,'peel',.92),c(.93,'roll',.995)];
  X[17]=[c(.02,'tape',.26),c(.28,'peel',.44),c(.5,'roll',.96),c(.96,'chime')];
  X[18]=[c(0,'tape',.11),c(.11,'tape',.2),c(.21,'peel',.31),c(.42,'thud'),c(.44,'roll',.78),c(.79,'peel',.88),c(.89,'roll',.98)];
  X[19]=[c(.01,'slide',.12),c(.12,'thud'),c(.15,'tape',.27),c(.27,'tape',.39),c(.41,'peel',.49),c(.5,'peel',.58),c(.61,'slide',.72),c(.73,'thud'),c(.75,'slide',.92),c(.92,'thud')];
  X[20]=[c(.22,'tink'),c(.24,'tape',.36),c(.39,'roll',.77),c(.78,'peel',.87),c(.88,'roll',.98)];
  X[21]=[c(0,'slide',.08),c(.08,'thud'),...[0,1,2,3].map(i=>c(.1+i*.065,'etape',.16+i*.065)),...[0,1,2].map(i=>c(.38+i*.13,'glue')),c(.8,'chime'),c(.82,'slide',.98)];
  return X})();
let sfxPrev=-1;
function runSfx(i,t){const list=SFX[i];if(!list)return;
  if(t<sfxPrev-1e-6){SND.stop();sfxPrev=-1}           // 다시 보기
  if(t-sfxPrev>.3&&sfxPrev>=0){sfxPrev=t;return}       // 크게 건너뛰면 소리 생략
  const dur=STEPS[i].dur;for(const q of list)if(q.a>sfxPrev&&q.a<=t)SND.play(q.s,q.b!=null?(q.b-q.a)*dur:.3);
  sfxPrev=t}

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
const tabsEl=$('tabs'),chipsEl=$('chips'),lblLayer=$('labels');
let cur=0,stepStart=performance.now(),showLabels=true,xray=false;
STEPS.forEach((s,i)=>{s.idx=i;s.num=STEPS.filter((q,j)=>j<=i&&q.g===s.g).length});
GROUPS.forEach(g=>{const b=document.createElement('button');b.className='tab';b.textContent=g.name;b.onclick=()=>go(STEPS.findIndex(s=>s.g===g.id));g.el=b;tabsEl.appendChild(b)});
function numLabel(s){return s.g==='D'?String(s.num):String(s.idx-7)}
function renderChips(){const s=STEPS[cur];chipsEl.innerHTML='';STEPS.filter(q=>q.g===s.g).forEach(q=>{const b=document.createElement('button');b.className='chip'+(q.idx===cur?' on':q.idx<cur?' done':'');
  b.innerHTML=`<b>${numLabel(q)}</b><span>${q.short}</span>`;b.onclick=()=>go(q.idx);chipsEl.appendChild(b)});
  const on=chipsEl.querySelector('.chip.on');if(on&&chipsEl.scrollWidth>chipsEl.clientWidth)chipsEl.scrollLeft=on.offsetLeft-chipsEl.offsetLeft-(chipsEl.clientWidth-on.offsetWidth)/2;
  GROUPS.forEach(g=>g.el.classList.toggle('on',g.id===s.g))}
let camTween=null;
/* 좁은(세로) 화면에서는 옆이 잘리지 않게 카메라를 뒤로 뺌 */
function camZoom(){return clamp(1.55/Math.max(camera.aspect,.3),1,2.3)}
function camPT(c){const tg=root.localToWorld(V(...c.t)),p=root.localToWorld(V(...c.p));p.sub(tg).multiplyScalar(camZoom()).add(tg);return [p,tg]}
function camTo(c,d=1300){const [p,tg]=camPT(c);camTween={p0:camera.position.clone(),t0:controls.target.clone(),p1:p,t1:tg,st:performance.now(),d}}
function go(i,keepCam){const prev=cur;cur=clamp(i,0,STEPS.length-1);const s=STEPS[cur];stepStart=performance.now();s._ph=0;SND.stop();sfxPrev=-1;if(!keepCam&&prev!==cur)SND.play('click');
  root.rotation.y=s.rot;root.updateMatrixWorld(true);
  const gname=GROUPS.find(g=>g.id===s.g);
  $('figS').textContent=s.fig;
  $('modeV').textContent=gname.mode==='도안'?'도안':'PART '+gname.mode;$('modeS').textContent=`STEP ${String(cur+1).padStart(2,'0')} / ${STEPS.length}`;
  $('cnt').textContent=`${cur+1}/${STEPS.length}`;
  $('htT').innerHTML=`<em>${s.g==='D'?'도안 '+s.num:s.g+' '+(s.idx-7)}</em>${s.title}${cur===STEPS.length-1?'<span class="done-badge">완성</span>':''}`;
  $('htB').innerHTML=s.body;const w=$('htW');w.classList.toggle('show',!!s.warn);w.innerHTML=s.warn?'⚠ '+s.warn:'';
  $('toolList').innerHTML=s.tools.length?s.tools.map(n=>`<div class="tool"><i style="background:${TCOL[n]||'#ccc'}"></i>${n}</div>`).join(''):'<div class="tool none">손으로 해요</div>';
  renderChips();
  if(!keepCam){const [p,tg]=camPT(s.cam);camTween={p0:camera.position.clone(),t0:controls.target.clone(),p1:p,t1:tg,st:performance.now(),d:1300}}
}
$('prev').onclick=()=>go(cur-1);$('next').onclick=()=>go(cur+1);$('replay').onclick=()=>{stepStart=performance.now()};
function sndUI(){const b=$('sndBtn');b.classList.toggle('on',SND.on);b.innerHTML=(SND.on?'🔊':'🔇')+'<span class="pt"> 소리</span>'}sndUI();
$('sndBtn').onclick=()=>{SND.init();SND.set(!SND.on);sndUI()};
$('lblBtn').onclick=e=>{showLabels=!showLabels;e.currentTarget.classList.toggle('on',showLabels)};
$('xrayBtn').onclick=e=>{xray=!xray;e.currentTarget.classList.toggle('on',xray);sheetMats.forEach(m=>{m.transparent=xray;m.opacity=xray?.28:1;m.depthWrite=!xray;m.needsUpdate=true})};
/* 전체화면 */
const FS_IN='<svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>',FS_OUT='<svg viewBox="0 0 24 24"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>';
const docEl=document.documentElement,fsReq=docEl.requestFullscreen||docEl.webkitRequestFullscreen;
const fsNow=()=>!!(document.fullscreenElement||document.webkitFullscreenElement);
function fsUI(){const b=$('fsBtn'),on=fsNow();b.classList.toggle('on',on);b.innerHTML=(on?FS_OUT:FS_IN)+`<span class="pt"> ${on?'나가기':'전체화면'}</span>`}
function fsToggle(){let r;if(fsNow())r=(document.exitFullscreen||document.webkitExitFullscreen).call(document);else if(fsReq)r=fsReq.call(docEl);if(r&&r.catch)r.catch(()=>{})}
if(!fsReq)$('fsBtn').style.display='none';
$('fsBtn').onclick=fsToggle;document.addEventListener('fullscreenchange',fsUI);document.addEventListener('webkitfullscreenchange',fsUI);fsUI();
/* 설명 접기 */
let fold=false;try{fold=localStorage.getItem('telescope3d.fold')==='1'}catch(e){}
function foldUI(){$('app').classList.toggle('fold',fold);$('fold').textContent=fold?'▲ 펴기':'▼ 접기'}
$('fold').onclick=()=>{fold=!fold;try{localStorage.setItem('telescope3d.fold',fold?'1':'0')}catch(e){}foldUI()};foldUI();
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'){go(cur+1);e.preventDefault()}else if(e.key==='ArrowLeft'||e.key==='PageUp'){go(cur-1);e.preventDefault()}else if(e.key===' '){stepStart=performance.now();e.preventDefault()}else if(e.key==='l'||e.key==='L')$('lblBtn').click();else if(e.key==='x'||e.key==='X')$('xrayBtn').click();else if(e.key==='s'||e.key==='S')$('sndBtn').click();else if(e.ctrlKey||e.metaKey||e.altKey)return;else if(e.key==='f'||e.key==='F')fsToggle();else if(e.key==='h'||e.key==='H')$('fold').click()});
controls.addEventListener('start',()=>{camTween=null});

const pool=[];
function renderLabels(){const w=canvas.clientWidth,h=canvas.clientHeight;let n=0;
  if(showLabels)for(const l of LBL){const v=root.localToWorld(l.v.clone()).project(camera);if(v.z>1)continue;
    let el=pool[n];if(!el){el=document.createElement('div');pool.push(el);lblLayer.appendChild(el)}
    if(el._t!==l.t){el.textContent=l.t;el._t=l.t}if(el._c!==l.c){el.className='lbl '+l.c;el._c=l.c}
    el.style.display='block';const x=(v.x+1)/2*w,y=(1-v.y)/2*h;el.style.transform=`translate(${x-el.offsetWidth/2}px,${y-el.offsetHeight-16}px)`;n++}
  for(let i=n;i<pool.length;i++)pool[i].style.display='none'}

function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}
new ResizeObserver(resize).observe(canvas);
function frame(now){
  const s=STEPS[cur],t=clamp((now-stepStart)/(s.dur*1000),0,1);
  $('progBar').style.width=(t*100)+'%';
  hideAll();LBL=[];s.apply(t,now/1000);runSfx(cur,t);
  if(camTween){const k=ease(clamp((now-camTween.st)/camTween.d,0,1));camera.position.lerpVectors(camTween.p0,camTween.p1,k);controls.target.lerpVectors(camTween.t0,camTween.t1,k);if(k>=1)camTween=null}
  controls.update();renderer.render(scene,camera);renderLabels();requestAnimationFrame(frame)}
drawSheetTo(finalCv,8,1,true);finalTex.needsUpdate=true;
document.fonts&&document.fonts.ready.then(()=>{drawSheetTo(finalCv,8,1,true);finalTex.needsUpdate=true;sheetKey='';ALLSHEETS.forEach(r=>{r.decorKey=null})});
resize();go(0);camera.position.copy(camTween.p1);controls.target.copy(camTween.t1);camTween=null;
requestAnimationFrame(frame);
window.__go=go;window.__snd={SND,SFX,log:null,run:(i,t)=>runSfx(i,t),reset:()=>{sfxPrev=-1}};{const p0=SND.play.bind(SND);SND.play=(n,l)=>{if(window.__snd.log)window.__snd.log.push([cur,n,+l.toFixed(2)]);p0(n,l)}}window.__state=()=>({cur});
window.__seek=t=>{stepStart=performance.now()-t*STEPS[cur].dur*1000};
window.__test=()=>{const bad=[];STEPS.forEach((s,i)=>{for(let k=0;k<=100;k++){try{hideAll();LBL=[];s.apply(k/100,k*.1)}catch(e){bad.push(i+1+'단계 t='+k/100+': '+e.message);break}}});go(cur,true);return bad};
</script>
